# Establish ROM compatibility separately from root and VFS changes after the previous integration bootlooped.
name: Build vili boot baseline

on:
  workflow_dispatch:

# This workflow only reads sources and uploads evidence; it cannot flash a device.
permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/Spanish-or-Vanish/kernel_xiaomi_sm8350
  KERNEL_REF: 3679ab828bc4464e4e41152154ca0f5c6ed361e6
  ANYKERNEL_REPO: https://github.com/loystonpais/AnyKernel3
  ANYKERNEL_REF: a4ffe92b9b05b058960079e9b6b029f7dfe954f2

jobs:
  baseline:
    runs-on: namespace-profile-kernel
    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      KBUILD_BUILD_USER: ci
      KBUILD_BUILD_HOST: github
    steps:
      # Configuration and scripts must come from the exact requested builder revision.
      - uses: actions/checkout@v4

      - name: Install LLVM 18 toolchain
        run: |
          # Titanic uses LLVM 18; do not carry the older tree's LLVM 14 recipe into this baseline.
          # Cross libc headers/static libraries are required by Kconfig's ARM64 link capability probes.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 gcc g++ gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            make bc bison flex libssl-dev libelf-dev kmod dwarves \
            openssl python3 cpio lz4 gzip xz-utils zstd git perl zip curl
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - name: Resolve known-working device configuration
        run: |
          # The newer published branch includes filesystem and RCU backports absent from the failed source.
          git init kernel
          git -C kernel remote add origin "$KERNEL_REPO"
          git -C kernel fetch --depth 1 origin "$KERNEL_REF"
          git -C kernel checkout --detach FETCH_HEAD
          mkdir -p kernel/out
          cp configs/vili-working.config kernel/out/.config
          # Give the diagnostic build a distinct name without changing device feature selection.
          kernel/scripts/config --file kernel/out/.config --set-str LOCALVERSION -vili-baseline -d LOCALVERSION_AUTO
          make -C kernel O=out olddefconfig
          python3 scripts/verify-vili-baseline.py configured

      - name: Build baseline Image
        run: |
          # Preserve pipeline failure and the vendor source's non-fatal warning policy.
          set -euo pipefail
          clang --version
          make_args=(-C kernel O=out LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            "KCFLAGS=-Wno-incompatible-function-pointer-types -Wno-error")
          # Generate shared SELinux headers before their built-in consumers.
          make "${make_args[@]}" -j"$(nproc)" security/selinux/ 2>&1 | tee baseline-build.log
          make "${make_args[@]}" -j"$(nproc)" Image 2>&1 | tee -a baseline-build.log

      - name: Package boot-only baseline
        run: |
          git clone "$ANYKERNEL_REPO" kernel/AK
          git -C kernel/AK checkout --detach "$ANYKERNEL_REF"
          cp AnyKernel/baseline-anykernel.sh kernel/AK/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image kernel/AK/Image
          cp baseline-info.json kernel/AK/baseline-info.json
          # Exclude DTB/DTBO, vendor_boot, module and ramdisk payloads to isolate the kernel.
          (cd kernel/AK && zip -r9 ../../vili-boot-baseline.zip Image anykernel.sh baseline-info.json tools META-INF)
          python3 scripts/verify-vili-baseline.py package
          sha256sum vili-boot-baseline.zip > baseline-SHA256SUMS

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vili-baseline-evidence
          path: |
            kernel/out/.config
            baseline-info.json
            baseline-build.log
          include-hidden-files: true
          if-no-files-found: ignore

      # Publish a package only after the embedded config and payload checks pass.
      - name: Upload verified baseline package
        uses: actions/upload-artifact@v4
        with:
          name: vili-boot-baseline
          path: |
            vili-boot-baseline.zip
            baseline-SHA256SUMS
            baseline-info.json
          if-no-files-found: error
