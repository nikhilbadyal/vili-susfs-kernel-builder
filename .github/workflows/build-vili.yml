# Build a vili (Xiaomi Mi 11T Pro, SM8350) 5.4 kernel with KernelSU-Next + SuSFS.
#
# Recipe follows loystonpais's authoritative vili build (merged QGKI defconfig incl.
# vili_QGKI.config, TARGET_PRODUCT=vili, proper dtbo/dtb/modules packaging) applied to
# the SAME source the user's ROM kernel is built from (Spanish-or-Vanish@vili_ksu-302),
# so the result matches the device with no drift. We add the susfs kernel-5.4 VFS patch
# (the half the stock TitanicExtended build omitted) and enable the SUSFS configs.
# clang-14 is used because noxcis proved it on the identical SM8350 5.4.302 susfs kernel.
name: Build vili KSU-Next SUSFS

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU-Next ref (tag/branch). v3.4.2 = latest; blank = keep source submodule (pershoot next-susfs)."
        default: "v3.4.2"
      susfs_branch:
        description: "susfs4ksu branch for this kernel."
        default: "kernel-5.4"

env:
  KERNEL_REPO: https://github.com/Spanish-or-Vanish/kernel_xiaomi_sm8350
  KERNEL_BRANCH: vili_ksu-302
  ANYKERNEL_REPO: https://github.com/loystonpais/AnyKernel3
  ANYKERNEL_REF: a4ffe92b9b05b058960079e9b6b029f7dfe954f2

jobs:
  build:
    # Namespace custom runner (16 GB RAM, 8 vCPU) — faster than the default GitHub runner.
    runs-on: namespace-profile-kernel
    steps:
      - name: Show runner disk/space
        run: |
          df -h / | tail -1; nproc; free -h | head -2
          # Best-effort reclaim (harmless if dirs are absent on this runner).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Install toolchain (clang-14 + aarch64 gcc; proven on SM8350 5.4.302)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-14 lld-14 llvm-14 gcc g++ gcc-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev kmod dwarves \
            device-tree-compiler openssl python3 cpio lz4 gzip xz-utils zstd git perl zip
          for t in clang clang++ clang-cpp ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip llvm-size llvm-strings \
                   llvm-readobj llvm-config; do
            sudo ln -sf "/usr/bin/${t}-14" "/usr/bin/${t}" 2>/dev/null || true
          done
          clang --version | head -1

      - name: Clone kernel source (+ submodules)
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git submodule update --init --depth 1 || true

      - name: Pin KernelSU-Next (built-in susfs KSU-side)
        working-directory: kernel/KernelSU-Next
        run: |
          if [ -n "${{ inputs.ksu_ref }}" ]; then
            git remote set-url origin https://github.com/KernelSU-Next/KernelSU-Next.git || true
            git fetch --tags --force --depth 1 origin "${{ inputs.ksu_ref }}" 2>/dev/null \
              || git fetch --tags --force origin || true
            git checkout "${{ inputs.ksu_ref }}" 2>/dev/null \
              || git checkout "tags/${{ inputs.ksu_ref }}" 2>/dev/null \
              || echo "::warning::keeping submodule default (${{ inputs.ksu_ref }} not found)"
          fi
          echo "KSU-Next: $(git describe --tags 2>/dev/null || git rev-parse --short HEAD)"

      - name: Apply SuSFS kernel-5.4 VFS patch
        working-directory: kernel
        run: |
          git clone --depth 1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true
          echo ">>> Applying 50_add_susfs_in_kernel-5.4.patch"
          patch -p1 --fuzz=3 --no-backup-if-mismatch \
            < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
          echo ">>> Rejects (if any):"; find . -name '*.rej' -print -exec cat {} \; || true

      - name: Enable KSU + SUSFS configs (into the base defconfig of the merge)
        working-directory: kernel
        run: |
          cat >> arch/arm64/configs/vendor/lahaina-qgki_defconfig <<'CFG'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAPS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CFG

      - name: Configure (merged vili QGKI defconfig)
        working-directory: kernel
        env: { ARCH: arm64, LLVM: "1", LLVM_IAS: "1", CROSS_COMPILE: aarch64-linux-gnu-, CLANG_TRIPLE: aarch64-linux-gnu-, TARGET_PRODUCT: vili }
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            vendor/lahaina-qgki_defconfig \
            vendor/debugfs.config \
            vendor/xiaomi_QGKI.config \
            vendor/vili_QGKI.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          echo ">>> SUSFS in .config:"; grep -E 'CONFIG_KSU(_SUSFS)?=' out/.config || true

      - name: Build Image + dtbs + modules
        working-directory: kernel
        env: { ARCH: arm64, LLVM: "1", LLVM_IAS: "1", CROSS_COMPILE: aarch64-linux-gnu-, CLANG_TRIPLE: aarch64-linux-gnu-, TARGET_PRODUCT: vili, KBUILD_BUILD_USER: ci, KBUILD_BUILD_HOST: github }
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-incompatible-function-pointer-types -Wno-error" \
            -j"$(nproc)" Image dtbs modules
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            modules_install INSTALL_MOD_PATH=modules_install
          echo ">>> boot artifacts:"; ls -la out/arch/arm64/boot/ || true
          echo ">>> dtbs:"; find out/arch/arm64/boot/dts -name '*vili*' -o -name 'lahaina*.dtb' 2>/dev/null | head

      - name: Package with loystonpais AnyKernel3 (vili dtbo/dtb/modules)
        working-directory: kernel
        run: |
          git clone "$ANYKERNEL_REPO" AK && (cd AK && git checkout "$ANYKERNEL_REF")
          cd AK
          cp ../out/arch/arm64/boot/Image Image
          # vili DTBO overlay → dtbo.img (exact name may vary; fall back to any vili overlay)
          DTBO=$(find ../out/arch/arm64/boot/dts -name 'vili-sm8350-overlay.dtbo' 2>/dev/null | head -1)
          [ -z "$DTBO" ] && DTBO=$(find ../out/arch/arm64/boot/dts -iname '*vili*overlay*.dtbo' 2>/dev/null | head -1)
          [ -n "$DTBO" ] && python3 mkdtboimg.py create dtbo.img --page_size=4096 "$DTBO" || echo "::warning::vili overlay dtbo not found"
          # platform dtb
          DTB=$(find ../out/arch/arm64/boot/dts -name 'lahaina-v2.1.dtb' 2>/dev/null | head -1)
          [ -z "$DTB" ] && DTB=$(find ../out/arch/arm64/boot/dts -iname 'lahaina*.dtb' 2>/dev/null | head -1)
          [ -n "$DTB" ] && cp "$DTB" dtb || echo "::warning::lahaina dtb not found"
          # modules
          mkdir -p modules/vendor/lib/modules
          if [ -d ../out/modules_install/lib/modules ]; then
            ./place-modules.sh ../out/modules_install/lib/modules/*/ modules/vendor/lib/modules "/vendor/lib/modules" || true
            find modules -name '*.ko' -exec llvm-strip --strip-unneeded -g {} \; || true
          fi
          sed -i 's/device\.name1=.*/device.name1=vili/' anykernel.sh || true
          zip -r9 ../../vili-ksunext-susfs.zip . -x '.git/*' -x '*.zip' -x '.build-placeholder'
          ls -la ../../vili-ksunext-susfs.zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: vili-ksunext-susfs
          path: vili-ksunext-susfs.zip
          if-no-files-found: error
